# GitHub Pages (https://www.passager.app) publishes the information site
# that lives in `website/` (its index.html declares `permalink: /`).
# The files below belong to the web application, not to that site.
# `index.html` in particular must be excluded: it is the entry point Vite
# needs in the repository root, and it would replace the site.
exclude:
  - index.html
  - src
  - public
  - bin
  - backend
  - build
  - node_modules
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - vite.config.js
  - eslint.config.js
  - vercel.json
  - nginx.conf
  - Dockerfile
  - Dockerfile.dev
  - CLAUDE.md
  - remoteconfig.template.json
  - README.md
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - LICENSE.md
