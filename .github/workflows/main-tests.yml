name: CI
'on':
  push:
    branches:
      - main
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Checkout the Repo
      - uses: actions/checkout@v4

      # Install pnpm (version from package.json packageManager)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Install Node 22 with pnpm cache
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # Install dependencies
      - run: pnpm install --frozen-lockfile

      # Lint
      - run: pnpm exec eslint . --max-warnings=0

      # Run tests
      - run: pnpm test

      # Build the production bundle
      - run: pnpm run build

      # Backend tests (no database needed)
      - name: Backend tests
        run: |
          for service in authentication-service documents-service; do
            (cd backend/$service && pnpm install --frozen-lockfile --ignore-workspace && pnpm test)
          done
